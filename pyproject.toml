[project]
name = "hexaflow"
version = "0.1.0"
requires-python = ">=3.12,<3.13"

dependencies = [
    "pillow>=10.0",
    "pynput>=1.7.7",
    "pyautogui>=0.9.54",
    "pystray>=0.19.5",
    "uiautomation>=2.0.20",
    "numpy==2.4.4",
    "sounddevice>=0.5.1",
    "onnxruntime-qnn>=1.18.0",
    "qai-appbuilder==2.50.40",
    "transformers==4.56.2",
    "geniex-qairt>=0.3.18,<0.4",
    "geniex>=0.7.0",
    "qai-hub-models-cli>=0.63.0",
]
[project.optional-dependencies]
build = [
    "pyinstaller>=6.0,<7",
]